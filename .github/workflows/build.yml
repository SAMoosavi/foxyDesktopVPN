name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# NOTE: this workflow only builds bundles. It never provisions hosting-side
# resources; repo setup stays a manual documented step (see task 11 runbook).

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux Tauri deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Trunk
        run: cargo install trunk --locked
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles appimage,deb
      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Trunk
        run: cargo install trunk --locked
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          if-no-files-found: error
          path: src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages + NDK
        run: >
          sdkmanager "platform-tools" "platforms;android-34"
          "build-tools;34.0.0" "ndk;26.1.10909125"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            wasm32-unknown-unknown
            aarch64-linux-android armv7-linux-androideabi
            i686-linux-android x86_64-linux-android
      - name: Install Trunk
        run: cargo install trunk --locked
      # NOTE: `tauri android init` generates src-tauri/gen/android/.
      # That output must be committed to the repo before this job can build;
      # CI never generates it from scratch (init is interactive / local-only).
      - uses: tauri-apps/tauri-action@v0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        with:
          args: --bundles apk
      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          if-no-files-found: error
          path: src-tauri/gen/android/**/build/outputs/apk/**/*.apk
